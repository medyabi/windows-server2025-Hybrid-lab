<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 692" width="760" height="692" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" role="img" aria-label="One outbound HTTPS connection puts each lab VM under Azure management">
