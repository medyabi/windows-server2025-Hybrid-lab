<text x="452" y="612" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">WAC in Azure, BPA, Remote Support</text>
<text x="24" y="668" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">Defender for Servers and Log Analytics ingestion are billed; the rest is free or included with Azure benefits.</text>
